name: Validación del prototipo
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Flutter 3.38.3
        run: |
          git clone --depth 1 --branch 3.38.3 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  firestore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix functions install
      - run: npm --prefix functions test
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-geocercas "npm --prefix functions run test:rules"
      - run: npx --yes firebase-tools@14 emulators:exec --only auth,firestore,functions --project demo-geocercas "node --test functions/test/emulator-flow.test.js"

  resultados:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r training/requirements-evaluation.txt
      - run: |
          python training/evaluate_shipped_tree.py --assets training/baseline_android_tree --output "$RUNNER_TEMP/android_tree_evaluation.json"
          diff -u training/results/android_tree_evaluation.json "$RUNNER_TEMP/android_tree_evaluation.json"
      - run: |
          python training/recalibrate_critical_tree.py --asset-output "$RUNNER_TEMP/critical-assets" --output "$RUNNER_TEMP/critical-tree.json"
          diff -u training/results/critical_tree_evaluation.json "$RUNNER_TEMP/critical-tree.json"
          for asset in decision_tree.json tree_scaler_params.json threshold_params.json; do
            diff -u "assets/ml/$asset" "$RUNNER_TEMP/critical-assets/$asset"
          done
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/critical-tree.json"))["partitions"]; assert all(p[k]["meets_minimum"] for k in ("historical_test_comparison", "new_synthetic_test"))'
      - run: |
          python training/evaluate_geofences.py --output "$RUNNER_TEMP/geofences.json"
          python -c 'import json, os; a=json.load(open("training/results/independent_geofence_evaluation.json")); b=json.load(open(os.environ["RUNNER_TEMP"]+"/geofences.json")); assert all(a[k]["matrix"] == b[k]["matrix"] for k in ("static","adaptive")); assert a["observations"] == b["observations"]'
