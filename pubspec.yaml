name: geocercas_app
description: Sistema de geolocalización con geocercas inteligentes adaptativas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter  # ← AGREGAR ESTO
  # Firebase (Plan Spark)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.0.0
  http: ^1.2.0 # Para hacer las peticiones HTTP a FCM
  googleapis_auth: ^1.4.1  # ← Para obtener tokens OAuth2
  # Geolocalización y background
  geolocator: ^13.0.1
  # Persistencia local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Criptografía y almacenamiento seguro
  encrypt: ^5.0.3
  local_auth: ^2.2.0 
  flutter_secure_storage: ^9.2.2
  # State Management y Navegación
  provider: ^6.1.2
  go_router: ^14.2.0
  # UI y utilidades
  cupertino_icons: ^1.0.8
  intl: any
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1 
  shared_preferences: ^2.2.2 
  pointycastle: ^3.7.3            # Algoritmos criptográficos
  connectivity_plus: ^5.0.2       # Detección de conectividad
  path_provider: ^2.1.2    # Para acceder al sistema de archivos
  crypto: ^3.0.3  # ← AGREGAR ESTA LÍNEA

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#081220"

flutter_native_splash:
  color: "#081220"
  image: assets/images/splash.png

  android_12:
    image: assets/images/splash.png
    color: "#081220"

flutter:
  uses-material-design: true
  assets:
    - assets/ml/tree_scaler_params.json
    - assets/ml/threshold_params.json
    - assets/icon/
    - assets/images/